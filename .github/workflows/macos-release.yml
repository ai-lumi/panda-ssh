name: macOS 无 Developer ID 发布包

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 输出构建环境
        run: |
          xcodebuild -version
          rustc --version
          cargo --version

      - name: 安装 Rust Apple 目标
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 运行 Rust 测试
        run: cargo test --workspace

      - name: 生成 Rust XCFramework 与 Xcode 工程
        run: |
          apple/Scripts/build-rust.sh
          cd apple
          xcodegen

      - name: 验证 XCFramework macOS 架构
        run: |
          XCFRAMEWORK="apple/Rust/PandaCoreFFI.xcframework"
          find "$XCFRAMEWORK" -path '*macos*' -type f -name 'libpanda_ffi*.a' -print | sort
          find "$XCFRAMEWORK" -path '*macos*' -type f -name 'libpanda_ffi*.a' -exec lipo -archs {} \; | tr ' ' '\n' | sort -u | grep -Fx arm64
          find "$XCFRAMEWORK" -path '*macos*' -type f -name 'libpanda_ffi*.a' -exec lipo -archs {} \; | tr ' ' '\n' | sort -u | grep -Fx x86_64

      - name: 构建无 Developer ID Universal App
        run: |
          xcodebuild \
            -project apple/PandaSSH.xcodeproj \
            -scheme PandaSSH-macOS \
            -configuration Release \
            -archivePath "$PWD/build/PandaSSH.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: 验证 App 架构并打包
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_APPS="$PWD/build/PandaSSH.xcarchive/Products/Applications"
          APP_PATH="$(find "$ARCHIVE_APPS" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$("/usr/libexec/PlistBuddy" -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          lipo -archs "$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME" | tr ' ' '\n' | grep -Fx arm64
          lipo -archs "$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME" | tr ' ' '\n' | grep -Fx x86_64
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/PandaSSH-${VERSION}.zip"
          hdiutil create -volname "Panda SSH" -srcfolder "$APP_PATH" -ov -format UDZO "dist/PandaSSH-${VERSION}.dmg"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.dmg \
            --title "Panda SSH ${GITHUB_REF_NAME}" \
            --notes $'此版本使用本地 ad-hoc 签名，不含 Developer ID，也未经 Apple 公证。\\n\\n首次启动：将 App 拖入“应用程序”后，按住 Control 键点击 App，选择“打开”，再在确认框中选择“打开”。请勿关闭 Gatekeeper 或执行系统级安全绕过命令。'
