<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Panda SSH Logo">
  <defs>
    <!-- 深色科技背景，从中央微微发亮到边缘 -->
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a2f24"/>
      <stop offset="60%" stop-color="#0f1a16"/>
      <stop offset="100%" stop-color="#0a100e"/>
    </radialGradient>

    <!-- 柔和绿光 -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 熊猫脸部轻微立体感 -->
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0ec"/>
    </linearGradient>
  </defs>

  <!-- 圆角图标底板 -->
  <rect x="10" y="10" width="492" height="492" rx="110" fill="url(#bg)" stroke="#142b20" stroke-width="2"/>

  <!-- 背景：极淡的 01 矩阵雨，保留 SSH 加密氛围但不抢主体 -->
  <g font-family="SF Mono, Menlo, monospace" font-size="14" fill="#2dd56f" opacity="0.12">
    <text x="64" y="140">0</text>
    <text x="64" y="180">1</text>
    <text x="64" y="220">0</text>
    <text x="64" y="260">1</text>

    <text x="448" y="120">1</text>
    <text x="448" y="160">0</text>
    <text x="448" y="200">1</text>
    <text x="448" y="240">0</text>

    <text x="110" y="420">1</text>
    <text x="110" y="450">0</text>
    <text x="402" y="430">0</text>
    <text x="402" y="460">1</text>
  </g>

  <!-- 顶部信号弧线（远程连接） -->
  <g fill="none" stroke="#2dd56f" stroke-width="6" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)">
    <path d="M236 86 A32 32 0 0 1 276 86"/>
    <path d="M222 66 A52 52 0 0 1 290 66" opacity="0.55"/>
  </g>

  <!-- 熊猫耳朵 -->
  <circle cx="170" cy="190" r="44" fill="#0d1412"/>
  <circle cx="342" cy="190" r="44" fill="#0d1412"/>

  <!-- 熊猫头主体 -->
  <ellipse cx="256" cy="268" rx="132" ry="114" fill="url(#face)"/>

  <!-- 左眼：终端光标（绿色竖线），代表 SSH 命令行 -->
  <rect x="204" y="242" width="12" height="38" rx="3" fill="#2dd56f" filter="url(#softGlow)"/>

  <!-- 右眼：绿色圆点 -->
  <circle cx="300" cy="261" r="13" fill="#2dd56f" filter="url(#softGlow)"/>

  <!-- 鼻子 -->
  <ellipse cx="256" cy="302" rx="14" ry="10" fill="#0d1412"/>

  <!-- 微笑 -->
  <path d="M232 318 Q256 338 280 318" fill="none" stroke="#0d1412" stroke-width="6" stroke-linecap="round"/>

  <!-- 终端提示符 >_ -->
  <g font-family="SF Mono, Menlo, monospace" font-size="44" font-weight="600" fill="#2dd56f" text-anchor="middle" filter="url(#softGlow)">
    <text x="256" y="418">&gt;_</text>
  </g>

  <!-- 光标下划线 -->
  <rect x="224" y="430" width="64" height="5" rx="2.5" fill="#2dd56f" opacity="0.7"/>

  <!-- 四角装饰点 -->
  <g fill="#2dd56f" opacity="0.35">
    <circle cx="52" cy="460" r="4"/>
    <circle cx="460" cy="52" r="4"/>
  </g>
</svg>
